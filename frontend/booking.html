<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Stay - Grand Hotel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            <span>✨</span> GRAND HOTEL
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="rooms.html">Rooms & Suites</a></li>
            <li><a href="my-booking.html">My Booking</a></li>
            <li><a href="staff-login.html" class="admin-btn">Staff Portal</a></li>
        </ul>
    </nav>

    <!-- Main Container -->
    <main class="container">
        <div class="voucher" style="max-width: 650px; border-top-color: var(--gold-primary);">
            <div class="voucher-header">
                <span style="font-size: 3rem; color: var(--gold-primary);">🛋️</span>
                <h2 style="color: var(--text-white); font-size: 2.2rem; font-family: 'Cormorant Garamond', serif; margin-top: 0.5rem;">Room Reservation Form</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Fill in your details below to secure your luxury stay.</p>
            </div>

            <div id="booking-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 0.8rem; border-radius: 10px; margin-bottom: 1.5rem; text-align: center; font-size: 0.9rem;"></div>

            <form onsubmit="submitBooking(event)">
                <div class="form-group" style="margin-bottom: 1.2rem;">
                    <label for="select_room">Select Room</label>
                    <select id="select_room" class="form-control" required onchange="updateEstimatedCost()">
                        <option value="">Loading available rooms...</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 1.2rem;">
                    <label for="customer_name">Full Name</label>
                    <input type="text" id="customer_name" class="form-control" placeholder="Enter guest full name" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.2rem;">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="e.g. 9876543210" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="e.g. guest@example.com" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.2rem;">
                    <div class="form-group">
                        <label for="check_in_date">Check-In Date</label>
                        <input type="date" id="check_in_date" class="form-control" required onchange="updateEstimatedCost()">
                    </div>
                    <div class="form-group">
                        <label for="check_out_date">Check-Out Date</label>
                        <input type="date" id="check_out_date" class="form-control" required onchange="updateEstimatedCost()">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="guests_count">Number of Guests</label>
                    <input type="number" id="guests_count" class="form-control" value="1" min="1" max="6" required>
                </div>

                <div id="price-summary" style="background: rgba(11, 15, 25, 0.6); padding: 1.2rem; border-radius: 10px; border: 1px solid var(--border-subtle); margin-bottom: 1.8rem;">
                    <div style="display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem;">
                        <span>Estimated Stay Duration:</span>
                        <strong id="preview-days" style="color: var(--text-white);">0 nights</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; color: var(--gold-primary); font-size: 1.3rem; font-weight: 800; margin-top: 0.5rem;">
                        <span>Estimated Room Charge:</span>
                        <strong id="preview-total">₹0.00</strong>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">CONFIRM RESERVATION</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <strong>Grand Hotel Management System</strong>. All rights reserved.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
